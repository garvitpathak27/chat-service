# RabbitMQ config for LOCAL DEV ONLY.
#
# By default RabbitMQ only lets the built-in `guest` user log in over a
# loopback connection. Chat connects as a container on the `chatapp`
# network, which is NOT loopback from RabbitMQ's point of view — guest
# would be refused with ACCESS_REFUSED without this.
loopback_users = none

